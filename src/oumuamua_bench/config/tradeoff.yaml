# 精度と計算負荷の関係を見るための構成 (bench_run.py --variants-file で渡す)。
# 計算負荷のつまみ:
#   sotoba : point_stride (スキャンの点の間引き)
#   amcl   : max_beams (使う光線の数) と粒子の数。既定は止まっていても毎スキャン更新 (_every)
#   emcl   : 粒子の数・scan_increment (光線の間引き)・膨張リセット。emcl2 はもともと止まっていても更新する
#   gicp   : point_stride (スキャンの点の間引き)。gicp_localizer はもともと毎スキャン更新する
# _est は state_estimator と組み合わせたもの (emcl2 は TF field -> odom を必ず出すので組み合わせない)

# --- 基準: sotoba + state_estimator (main) ---
sotoba_est_s1:
  launch_args: [estimator:=true]
sotoba_est_s4:
  launch_args: [estimator:=true]
  params: {sotoba_node: {point_stride: 4}}
sotoba_est_old:
  description: sotoba の以前の設定 (ゲートを段階的に狭め、毎スキャン 20 回反復、推定器 100 Hz)
  launch_args: [estimator:=true]
  params: {sotoba_node: {accept_distance_begin: 0.3, convergence_delta: 0.0}, state_estimator: {publish_rate: 100.0}}

# --- AMCL ---
amcl_b180_moving:
  description: AMCL の以前の設定 (動いたときだけ更新)
  launch_args: [localization:=amcl, estimator:=false]
  params: {amcl: {update_min_d: 0.02, update_min_a: 0.05}}
amcl_b180_every:
  description: AMCL の既定 (毎スキャン更新)
  launch_args: [localization:=amcl, estimator:=false]
amcl_b60_every:
  launch_args: [localization:=amcl, estimator:=false]
  params: {amcl: {max_beams: 60, min_particles: 200, max_particles: 1000}}
amcl_b360_every:
  launch_args: [localization:=amcl, estimator:=false]
  params: {amcl: {max_beams: 360, min_particles: 2000, max_particles: 8000}}
amcl_est_b180_every:
  launch_args: [localization:=amcl, estimator:=true]

# --- emcl2 ---  (alpha_threshold: 尤度がこれを下回ったら膨張リセット。0 でリセットしない)
emcl_p500:
  description: emcl2 の既定 (config/emcl2.yaml)
  launch_args: [localization:=emcl, estimator:=false]
emcl_p500_noreset:
  launch_args: [localization:=emcl, estimator:=false]
  params: {emcl2: {alpha_threshold: 0.0}}
emcl_p2000_noreset:
  launch_args: [localization:=emcl, estimator:=false]
  params: {emcl2: {num_particles: 2000, alpha_threshold: 0.0}}
emcl_p500_i1_noreset:
  launch_args: [localization:=emcl, estimator:=false]
  params: {emcl2: {scan_increment: 1, alpha_threshold: 0.0}}

# --- small_gicp ---
gicp_s1:
  launch_args: [localization:=gicp, estimator:=false]
gicp_s2:
  launch_args: [localization:=gicp, estimator:=false]
  params: {gicp_localizer: {point_stride: 2}}
gicp_s4:
  launch_args: [localization:=gicp, estimator:=false]
  params: {gicp_localizer: {point_stride: 4}}
gicp_est_s1:
  launch_args: [localization:=gicp, estimator:=true]
gicp_est_s4:
  launch_args: [localization:=gicp, estimator:=true]
  params: {gicp_localizer: {point_stride: 4}}
