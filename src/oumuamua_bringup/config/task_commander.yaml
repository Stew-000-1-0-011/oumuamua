# task_commander のパラメータ。座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左。自チームは +y 側)。
# task_commander は既定値を持たないので、全部ここに書く。odom_topic は bringup.launch.py が estimator 引数で上書きする。
#
# !!! 実機に合わせて決めること !!!
# - grippers.suction_offsets: 機体座標系 (x 前・y 左) での、各把持機構の吸着面の中心の位置。前は CAD の外形 (xz_footprint) で
#   吸ったノーツ (0.15 m 角) の手前の面の 0.269 m、左右は吸引の位置 (機体中心から左右に 0.115 m。gripper0 が左)
# - pick.poses: ブロックごと・把持機構ごとの、回収を始めるときの機体の中心の姿勢
#   回収・棚では機体の前を壁・棚へ向ける (後ろの LiDAR はブロックより低いので、ブロックへ向けない)
# - footprint: 機体 (持ち上げた把持機構を除く) の外形。CAD の足回り + LiDAR とその取付 (raised-box の footprint) を、
#   機体座標系に回したもの (CAD の y が機体の後ろ。LiDAR の出っ張りが x = -0.33 m に来る)
# - 昇降の番号 (lift.*) は gripper.yaml の lift.positions の並びと合わせる
task_commander:
  ros__parameters:
    odom_topic: /state_estimator/odom
    follow_action: /path_follower/follow

    # --- 機体と、動く前の間隔の確認 ---
    # [x0, y0, x1, y1, ...] 機体座標系 [m]。前 0.159 m、左右 0.236 / 0.226 m、後ろ 0.331 m (LiDAR)
    footprint: [
      0.0834, -0.2255,
      0.1582, -0.1824,
      0.1589, -0.1818,
      0.1593, -0.1809,
      0.1593, 0.1910,
      0.1590, 0.1920,
      0.1584, 0.1927,
      0.0839, 0.2357,
      0.0830, 0.2360,
      0.0822, 0.2359,
      -0.2393, 0.0504,
      -0.3311, 0.0504,
      -0.3311, -0.0400,
      -0.2393, -0.0400,
      0.0817, -0.2253,
      0.0825, -0.2256,
    ]
    min_clearance: 0.02         # [m] 直線で動く間、機体の外形と壁・棚・残っているブロックの間にこれだけ空ける
    sweep_step: 0.02            # [m] 確認する点の間隔
    travel_speed: 0.0           # [m/s] 移動の速さの上限。0 なら path_follower の limits.max_speed
    approach_speed: 0.3         # [m/s] ブロック・棚へ寄る、離れるときの速さの上限

    # フィールドの形 (壁・棚・ノーツ) とスタート位置は field.yaml (field.*) から読む。このファイルと一緒に読ませること

    # --- 場所 [x, y, yaw] (TO_START は field.yaml の start_pose へ) ---
    slalom:
      entrance: [-2.05, 0.668, 3.141592653589793]   # スタートゾーン側、境界の隙間 (y = 0.02..1.069) の手前。config/paths/slalom.route.yaml の始点
      exit: [1.25, 1.273, 3.141592653589793]        # ゴールゾーン側、列 3 を抜けた所。slalom.route.yaml の終点
      forward_route: slalom_forward     # path_follower.yaml の paths にある名前
      backward_route: slalom_backward

    # --- 回収 (ノーツの位置は field.yaml の notes_*。番号 0 が外周壁の側) ---
    pick:
      # 回収するときの機体の中心の姿勢 [x, y, yaw] (フィールド座標系)。ブロックごとに gripper0, gripper1 の順。
      # 吸引は寄る前に回しておき、ここで昇降を下ろして grip_time 待ってから持ち上げる (動く前に壁・残っているブロックとの間隔を確かめる)。
      # 今の値は、吸ったノーツの中心をブロックの中心に合わせた所から 0.06 m 手前 (0.03 m では箱に近すぎたので、
      # さらに機体の向きと逆へ 0.03 m 下げた)。向きは、0.03 m 手前のときに壁や隣のブロックと 0.02 m 空くように選んだもの (-1.5708 = -90 度でブロックに正対。ブロック 0 の gripper0 は -127 度、
      # ブロック 1 の gripper0 は -96 度の斜め)。ノーツの位置を変えたら直すこと
      poses:
        block0: [-2.493, 0.522, -2.2166,  -2.510, 0.527, -1.5708]
        block1: [-2.487, 0.538, -1.6755,  -2.280, 0.527, -1.5708]
        block2: [-2.300, 0.527, -1.5708,  -2.050, 0.527, -1.5708]
        block3: [-2.070, 0.527, -1.5708,  -1.820, 0.527, -1.5708]
        block4: [-1.840, 0.527, -1.5708,  -1.590, 0.527, -1.5708]
      # 2 個同時に回収するとき (PICK_PAIR) の機体の中心の姿勢: [gripper0 のブロック, x, y, yaw, ...]。gripper1 はその 1 つ前
      # (-x 側) のブロックを取る。ノーツの間隔と左右の吸引の間隔がどちらも 0.230 m なので、2 個の真ん中に正対すれば
      # 両方の真上に来る。y は吸ったノーツの中心をブロックの中心に合わせた所から 0.06 m 手前。
      # 壁・残っているブロックとは 0.18 m 以上空く
      pairs: [
        4.0, -1.830, 0.529, -1.5708,   # ブロック 4 (gripper0) と 3 (gripper1)
        2.0, -2.290, 0.529, -1.5708,   # ブロック 2 (gripper0) と 1 (gripper1)
      ]
      # 回収するときは、まずここ [x, y, yaw] へ動いて回収の向きに回ってから、手前の位置へ寄る。今の位置から直接寄ると、
      # 回りながら動く途中で後ろの LiDAR がスタートゾーンの境界の壁の先端に当たることがある (ブロック 4 を gripper0 で取るとき)。
      # スタート位置・スラロームの入口・どのブロックとの往復でも、壁や残っているブロックと 0.023 m 以上空く
      via: [-2.2, 0.75, -1.5708]
      standoff: 0.15            # [m] 回収を始める姿勢の手前のこの距離から寄る (機体から吸ったノーツへ向かう向きと逆へ離れる)
      # [m] 赤コートでは、poses / pairs の姿勢から、機体から吸ったノーツへ向かう向きに、さらにこれだけ寄って回収する
      red_extra_reach: 0.02
      grip_time: 1.5            # [s] 昇降を下ろしきってから持ち上げるまで

    # --- 棚 (棚の列と自チーム側の面は field.yaml の shelf_*) ---
    # 棚に置く動き (段の高さに上げる・前後に差し込む・吸引を切る) は手でする。task_commander は列 (x) と向きだけ合わせる
    shelf:
      # [m] TO_SHELF_FRONT で止まる所: 吸ったノーツの前の面 (機体から遠い面) が、棚の中心面 (y = 0) からこれだけ手前。
      # 中央の列の正面で、place.yaw を向く。今の寸法では機体の中心が y = 0.33 + 0.344 + 0.075 = 0.749
      # (ノーツの前の面は棚の面 y = 0.30 の 0.03 m 手前)
      front_distance: 0.33
    place:
      # TO_SHELF_CELL の機体の向き (前の把持機構を棚へ向ける)。TO_SHELF_CELL は今の y のまま、吸ったノーツの x を列に合わせるだけで、
      # 棚へ差し込む前後の動きは手でする
      yaw: -1.5707963

    # --- 昇降の高さ (gripper.yaml の lift.positions の番号) ---
    lift:
      pick: 0                   # 吸着面がブロックの上面に当たる
      clear: 1                  # 吸着面がブロックの上面より少し上 (回収のために寄るとき)
      carry: 2                  # 運ぶとき (吸ったブロックの下面がスラロームの壁 0.09 m より上)
      timeout: 10.0             # [s]

    grippers:
      names: [gripper0, gripper1]
      # [x0, y0, x1, y1] 吸着面の中心の、機体の中心からの位置 (機体座標系、x 前・y 左)。gripper0 が左、gripper1 が右。
      # 吸ったノーツの中心は、ここから field.note_size の半分だけ前 (今は 0.344 m)
      suction_offsets: [0.269, 0.115, 0.269, -0.115]
