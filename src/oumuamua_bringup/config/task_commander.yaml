# task_commander のパラメータ。座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左。自チームは +y 側)。
# task_commander は既定値を持たないので、全部ここに書く。odom_topic は bringup.launch.py が estimator 引数で上書きする。
#
# !!! 実機に合わせて決めること !!!
# - grippers.offsets: 機体座標系 (x 前・y 左) での、各把持機構の吸着面の中心の位置。今は「機体の後ろに 0.45 m
#   (円の外形より 0.15 m 外) 張り出し、左右に 0.12 m ずつ」と仮定し、回収・配置では機体の後ろを壁・棚へ向ける
#   (pick.yaw / place.yaw = +pi/2。正面の LiDAR はブロックより低いので、ブロックへ向けない)
# - robot_radius: 機体 (把持機構を除く) を囲む円の半径
# - 昇降の番号 (lift.*) は gripper.yaml の lift.positions の並びと合わせる
task_commander:
  ros__parameters:
    odom_topic: /state_estimator/odom
    follow_action: /path_follower/follow

    # --- 機体と、動く前の間隔の確認 ---
    robot_radius: 0.32          # [m] 半径 0.30 m の円 + 正面の LiDAR (0.315 m)
    min_clearance: 0.02         # [m] 直線で動く間、機体の円と壁・棚・残っているブロックの間にこれだけ空ける
    sweep_step: 0.02            # [m] 確認する点の間隔
    travel_speed: 0.0           # [m/s] 移動の速さの上限。0 なら path_follower の limits.max_speed
    approach_speed: 0.3         # [m/s] ブロック・棚へ寄る、離れるときの速さの上限

    # フィールドの形 (壁・棚・ノーツ) とスタート位置は field.yaml (field.*) から読む。このファイルと一緒に読ませること

    # --- 場所 [x, y, yaw] (TO_START は field.yaml の start_pose へ) ---
    slalom:
      entrance: [-2.05, 0.668, 0.0]     # スタートゾーン側、境界の隙間 (y = 0.2665..1.069) の手前。config/paths/slalom.route.yaml の始点
      exit: [1.25, 1.273, 0.0]          # ゴールゾーン側、列 3 を抜けた所。slalom.route.yaml の終点
      forward_route: slalom_forward     # path_follower.yaml の paths にある名前
      backward_route: slalom_backward

    # --- 回収 (ノーツの位置は field.yaml の notes_*。番号 0 が外周壁の側) ---
    pick:
      yaw: 1.5707963            # 回収するときの機体の向き (+y 向き = 後ろをブロックへ向ける)
      standoff: 0.15            # [m] ブロックの真上の手前のこの距離から寄る (把持機構の向きと逆へ離れる)
      grip_time: 0.5            # [s] 吸引をオンにしてから持ち上げるまで

    # --- 配置 (棚の列・段と自チーム側の面は field.yaml の shelf_*) ---
    shelf:
      place_depth: 0.085        # [m] ブロックの中心を面からこれだけ奥に置く (前の面が 0.01 m 奥に入る)
    place:
      yaw: 1.5707963            # 置くときの機体の向き (後ろを棚へ向ける)
      standoff: 0.15            # [m] マスの手前のこの距離から差し込む
      release_time: 0.5         # [s] 吸引をオフにしてから持ち上げるまで

    # --- 昇降の高さ (gripper.yaml の lift.positions の番号) ---
    # 下の番号は、gripper.yaml にコメントで置いてある 9 個の並び (棚まで届くとき) を前提にしている。
    # 今の gripper.yaml は暫定の配線で 3 個 (下 0 / 中 0.09 / 上 0.18 m) なので、pick・clear・carry は動くが、
    # PLACE は「index 3 is out of lift.positions」で失敗する
    lift:
      pick: 0                   # 吸着面がブロックの上面に当たる
      clear: 1                  # 吸着面がブロックの上面より少し上 (回収のために寄るとき)
      carry: 2                  # 運ぶとき (吸ったブロックの下面がスラロームの壁 0.09 m より上)
      row_approach: [3, 5, 7]   # 各段へ差し込むとき
      row_release: [4, 6, 8]    # 各段に置くとき
      timeout: 10.0             # [s]

    grippers:
      names: [gripper0, gripper1]
      offsets: [-0.45, 0.12, -0.45, -0.12]   # [x0, y0, x1, y1] 機体座標系
