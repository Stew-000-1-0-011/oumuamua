# chassis_node (omni_chassis) のパラメータ。chassis_node は既定値を持たないので、全部ここに書く。
# 項目の意味は omni_chassis の README を参照。「起動時のみ」以外は ros2 param set で実行中に変えられる。
#
# 3 輪オムニ。機体正面 (+x) は車輪 0 から中心を見た向き (把持機構の側。LiDAR と車輪 0 は後ろ)。
# 車輪 0, 1, 2 は上から見て左回りに 120 度ずつ:
#   車輪 0: 後ろ (180 度)、車輪 1: 右前 (300 度)、車輪 2: 左前 (60 度)
# 各車輪は、正転で機体を左回りに回す向き (位置の角度 + 90 度) に付いているとする。
# 正転で右回りに回す向きに付いている車輪は gear_ratio を -1.0 にする。
#
# L (中心から車輪までの水平距離) = 0.2 m、車輪半径 = 0.029 m (下の radius を参照)。
#   x = L cos(角度), y = L sin(角度)
chassis_node:
  ros__parameters:
    # --- 起動時のみ ---
    cmd_vel_topic: /cmd_vel
    cmd_vel_stamped: true       # true なら TwistStamped で受ける (tracker_node が時刻付きで出す)
    control_rate: 50.0          # [Hz] 目標を出す周期

    # --- 車輪 (機体座標系: x 前、y 左)。要素の並びは全項目で揃える ---
    # angle_deg: 車輪が正転したときに接地点が機体を押す向き [deg]

    wheels:
      x: [-0.2, 0.1, 0.1]                     # [m]
      y: [0.0, -0.17320508, 0.17320508]       # [m]
      angle_deg: [270.0, 30.0, 150.0]
      # 車輪半径 [m]。実機の走行記録 (2026-10-12 run1 / run2) で、自己位置から求めた移動距離が
      # 車輪オドメトリの 0.48〜0.49 倍 (旋回は 0.46 倍) だったので、0.06 から直した。実物の車輪を測って合わせること
      radius: [0.029, 0.029, 0.029]
      # 各車輪の mini_shirasu_node (名前 wheel0..2) の目標
      topic: [/wheel0/target_velocity, /wheel1/target_velocity, /wheel2/target_velocity]
      # mini-shirasu は encoder_cpr で駆動軸 (ホイール) 基準にしてあるので減速比は掛けない。
      # 付け向きで正転が逆になる車輪は -1.0 にする
      gear_ratio: [-1.0, -1.0, -1.0]
      # 各車輪の実測 (mini_shirasu_node の ~/joint_state)。車輪オドメトリ (~/body_velocity) に使う
      feedback_topic: [/wheel0/joint_state, /wheel1/joint_state, /wheel2/joint_state]

    # --- 実行中に変えられる ---
    base_frame: base_link       # ~/body_velocity の frame_id
    cmd_timeout: 0.2            # [s] cmd_vel がこれより来なければ目標をゼロにする
    # [s] 実測がこれより古い車輪があれば ~/body_velocity を出さない。実測は 50 Hz で届くが、
    # 2026-10-31 の記録 (fault1) で wheel0 の Status が CAN で 25% 抜け、最長 160 ms 途切れていたので 0.2 にしてある
    # (配線を直したら 0.1 に戻してよい)
    feedback_timeout: 0.2
    # 車輪の制限 (<= 0 で無効)。全車輪に同じ倍率をかけるので、進む向きは変わらない
    limits:
      # [rad/s] これを超える車輪があれば、全車輪を同じ割合で縮める (進む向きを保つ)。車輪ごとに頭打ちになると
      # 進む向きがゆがんで機体が回る (2026-10-31 の記録 slalom2) ので、基板の wmax (300) とモータの無負荷の最高
      # (24 V で約 267 rad/s) より少し下にして、こちらが先に効くようにしてある。250 rad/s は車輪半径 0.029 m で 7.25 m/s
      max_wheel_speed: 250.0
      # 加速も外してある (掛けると追従の応答が遅れる)
      max_wheel_accel: 0.0
