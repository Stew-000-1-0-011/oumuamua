# robot_sim (oumuamua_sim、sim:=true) のパラメータ。robot_sim は既定値を持たないので、ここと field.yaml・sotoba_node.yaml に全部書く。
# フィールドの形とスタート位置は field.yaml (sotoba_node と同じもの)、ノーツの有無 (include_notes) は sotoba_node.yaml から読む
# (bringup.launch.py がそれらを先に読ませている)。真の初期姿勢は field.yaml の start_pose に start_offset_* を足したもの。
# LiDAR の取付 (lidar_x / lidar_y / lidar_yaw / lidar_height / lidar_upside_down) は bringup.launch.py が launch 引数で上書きする。
robot_sim:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    cmd_vel_stamped: true      # true なら TwistStamped で受ける (tracker_node が時刻付きで出す)
    scan_topic: /scan
    sim_rate: 200.0            # [Hz] 運動の積分の周期

    # --- LiDAR の取付 (base_link -> laser)。高さと上下は lidar_height / lidar_upside_down ---
    lidar_x: -0.28             # LiDAR は機体の後ろ側
    lidar_y: 0.0
    lidar_yaw: 3.141592653589793   # 後ろ (-x) を向いている

    # --- 真の初期姿勢の、スタート位置 (field.yaml の start_pose) からのずれ (フィールド座標系) ---
    start_offset_x: 0.02       # [m]
    start_offset_y: -0.01      # [m]
    start_offset_yaw: 0.01     # [rad]

    # --- スキャン ---
    frame_id: laser
    scan_hz: 100.0
    ray_num: 417
    angle_min: -2.35619449
    angle_max: 2.35619449
    range_min: 0.05
    range_max: 30.0
    range_noise_stddev: 0.005  # [m]
    scan_latency: 0.0          # [s] 撮り終えてから届くまでの遅れ
    # [s] 1 スキャンを撮るのにかかる時間 (回転式 LiDAR の 1 周)。0 なら一瞬で撮る。
    # 撮っている間に機体が動くぶん歪む (例: 40 Hz の LiDAR なら 0.025)
    scan_duration: 0.0

    # --- 運動 (実行中に変えられる) ---
    cmd_timeout: 0.2           # [s] cmd_vel がこれより来なければ止まる
    plant:
      # cmd_vel への追従の時定数 [s]。実機の走行記録 (2026-10-12 run3 / run4、wkp 1.6) で、指令に対する
      # 車輪オドメトリの遅れが並進 0.18 s、旋回 0.09 s だったので、それに合わせてある
      tau_linear: 0.18
      tau_angular: 0.09
      # 実機の記録 (2026-10-12 run3 / run4) で出ていた加速の最大。<= 0 で無効
      max_accel_linear: 2.5    # [m/s^2]
      max_accel_angular: 0.0   # [rad/s^2]
      velocity_scale_linear: 1.0   # 実際に出る速度 / 指令 (滑りの模擬)
      velocity_scale_angular: 1.0

    # --- 機体の傾き (振動) [rad] ---
    # 走査面が水平でなくなり、壁を越えた光線がフィールドの外の物に、下を向いた光線が床に当たる。
    # roll と pitch は振幅 (amplitude + amplitude_per_speed * 速さ) で、少しずらした周波数で揺れる
    tilt:
      static_roll: 0.0           # 取付の傾き
      static_pitch: 0.0
      amplitude: 0.0             # 揺れの振幅
      amplitude_per_speed: 0.0   # 速さ 1 m/s あたりに増える振幅 [rad/(m/s)]
      frequency: 8.0             # [Hz]
      random_stddev: 0.0         # 白色の揺れ (光線ごと)

    # --- フィールドの外の環境 (sotoba は知らない。LiDAR が傾いたときに見える) ---
    environment:
      floor: true
      room_half_x: 4.3           # [m] 部屋の壁 (0 で無し)
      room_half_y: 3.2
      room_height: 2.5
      clutter_count: 8           # フィールドの外に置く箱 (人や机の代わり、0.5 x 0.5 x 1.2 m)
      field_margin: 0.034        # [m] 箱を置かない範囲 = フィールドの外周 (field.yaml の bounds) からこれだけ外 (外周壁の厚み)

    # --- 機体速度の実測 (車輪オドメトリの代わり) ---
    # ~/body_velocity (TwistStamped、機体座標系)。滑り (plant.velocity_scale_*) のぶんは割り戻すので、
    # 車輪オドメトリと同じく滑りを知らない値になる
    body_velocity_rate: 50.0
    body_velocity_noise_linear: 0.02   # [m/s]
    body_velocity_noise_angular: 0.05  # [rad/s]

    # --- 真値 ---
    field_frame: field
    truth_frame: base_link_truth
