# 把持機構 (昇降 + 吸引) の gripper_node のパラメータ。機構 i ごとに
# - gripper<i>: gripper_node (昇降のロボマス + 吸引のオン/オフ)
# - suction<i>: mini_shirasu_node (吸引のモータを電流制御)
# を立てる。suction<i> のパラメータは suction.yaml。
# gripper_node は既定値を持たないので、全部ここに書く。項目の意味は gripper と mini_shirasu_ros の README を参照。
#
# !!! 実機に合わせて決めること !!!
# - lift.motor / lift.c620: ロボマスの ID と ESC の種類
# - lift.target_scale: ボードの位置目標の単位 [?/m]
# - lift.meters_per_output_revolution: 出力軸 1 回転で上がる高さ (0 ならフィードバックを使わない)
# - lift.max_height: 昇降の行程
# - lift.positions: 使う高さ (回収・運搬・棚の各段)。~/set_lift_position で番号を送って選ぶ
# - suction.current と suction<i> の settings.imax: 吸引モータの許容電流
# - suction<i> の can_id は suction.yaml

# --- 全機構共通 ---
/**:
  ros__parameters:
    control_rate: 50.0
    lift:
      c620: false
      vel_kp: 0.15
      vel_ki: 9.0
      pos_kp: 0.5
      temperature_limit: 50
      enable_on_start: true
      config_repeat: 3
      # ボード (robomas_center の MotorCtrl.cpp) の位置目標は「ロータの角度 [deg]」で、位置制御を有効にした時点が 0。
      # 昇降は M2006 (ギヤ 36:1) の出力軸に半径 15 mm のピニオン: 出力軸 1 回転で 2π × 0.015 = 0.0942 m 上がる。
      # 高さ 1 m = 1 / 0.0942 回転 × 36 × 360 deg = 137509.9 deg (上がる向きが逆なら符号を反転)
      target_scale: -137509.9   # 実機で確かめた向き (正で下がった)
      target_offset: 0.0
      gear_ratio: 36.0
      meters_per_output_revolution: 0.0942478   # 2π × 0.015 m
      feedback_timeout: 0.2
      min_height: 0.0
      max_height: 0.85
      # 初めて動かすので遅めに (ロータで約 1100 rpm)
      max_speed: 0.15
      tolerance: 0.005
      settle_time: 0.2
      timeout_margin: 2.0
      # ~/set_lift_position の番号 -> 高さ [m] (起動時の位置が 0)。機構ごとに変えるなら gripper<i> に書く。
      # task_commander.yaml の lift.* がこの番号を指す (今は pick = 0, clear = 1, carry = 2 で、回収だけできる)。
      #           0: 下   1: 中段   2: 上段
      positions: [0.0,   0.09,     0.18]
      position_names: [bottom, middle, top]
      # 棚の段まで使うときは positions を次に替える
      # (task_commander.yaml の lift.* はこの並びを前提にしている)。ルール (千葉大学ロボットコンテスト 2026) の寸法と、次の仮定から決めた:
      # - 吸着面はブロック (一辺 0.15 m) を上から吸う。起動時 (昇降 0) の吸着面の高さは 0.15 m = 床のブロックの上面
      #   (なので、昇降の高さ = 吸っているブロックの下面の高さ)
      # - 棚の各段の床の上面: 0.32 / 0.553 / 0.787 m (図の「床から 0.30 m + 板 0.02 m」「全高 1.02 m」を 3 段で等分。
      #   表の「縦 260 mm」とは合わないので要確認)
      # - 差し込むときはブロックの下面を段の床から 0.02 m 上げ、置くときは 0.005 m まで下ろす
      #  番号:      0     1     2     3      4      5      6      7      8
      #             pick  clear carry row0↑  row0↓  row1↑  row1↓  row2↑  row2↓
      # positions: [0.0, 0.03, 0.12, 0.340, 0.325, 0.573, 0.558, 0.807, 0.792]
      # position_names: [pick, clear, carry, row0_approach, row0_release, row1_approach, row1_release, row2_approach, row2_release]
    suction:
      # ほぼ全開で回す (基板の電流ループが duty_max まで出す)。上限は suction.yaml の settings.imax (8 A)
      # 負で吸う向きに回る (正では逆に回った)
      current: -12.0            # 実数で書く (-10 だと整数になり、ノードが起動時に落ちる)
    robomas_frame_topic: /robomas_frame
    robomas_target_topic: ""    # 空なら /robomas_target<lift.motor>
    can_rx_topic: /robomas_can_rx

# 左 (task_commander.yaml の grippers.offsets で y = +0.12)
gripper0:
  ros__parameters:
    lift:
      motor: 1
    suction:
      target_topic: /suction0/target_current

# 右 (y = -0.12)
gripper1:
  ros__parameters:
    lift:
      motor: 2
      # 右はモータの付け方が左と逆なので、目標の向きも逆
      target_scale: 137509.9
    suction:
      target_topic: /suction1/target_current

