# フィールド (千葉大学ロボットコンテスト 2026) の寸法。フィールドの値はここにしか書かない。
# 読むもの: sotoba_node (推定に使う形)、robot_sim (模擬の世界)、task_commander (動く前の間隔の確認と作業の場所)、
#           oumuamua-controller の bridge (画面の表示)、make_path.py (経路の定義の field_file から、壁との間隔の確認)。
#
# 座標はフィールド座標系: 原点はフィールド中心の床、+x がスタート -> ビンゴ、+y が左。自チームは +y 側。
# 箱は [xmin, ymin, xmax, ymax] [m] で、壁は厚み (0.040 m) 込みの外形。
# x は青フィールドを巻き尺で測った値 (2026-10-31)。外周の内寸 5.570 m、
# 外周から下に伸びる壁: -x 端から 1.050、壁 (0.040)、1.630、壁、+x 端まで 2.810。
# センターラインから上に伸びる壁: -x 端から 1.880、壁、1.630、壁。-y 側は y を反転したものとしている。
# y (列の長さ、外周の幅) は測っていないので、厚みを 0.040 にした以外は前の値のまま
/**:
  ros__parameters:
    field:
      # 外周壁の内側の面 (ロボットはこの中にいる)
      bounds: [-2.785, -1.655, 2.785, 1.655]
      # 壁の高さ [m]。sotoba は、これが LiDAR の走査面 (lidar_height) より低い壁を見えないものとして扱う。
      # 実物は 0.09 m だが、走査面 (0.14 m) より高いものとして 0.3 にしてある
      wall_height: 0.3
      # 内側の壁 (外周壁以外)。sotoba_ros の旧 objects.cpp と同じもの
      walls: [
        -2.8025, -0.020, 1.5625, 0.020,        # センターライン
        -0.905, 0.0225, -0.865, 0.8905,        # スラロームの列 1 (センターラインから生える)
        -0.905, -0.8905, -0.865, -0.0225,
        -1.735, 1.069, -1.695, 1.669,          # スタートゾーンとスラロームの境界
        -1.735, -1.669, -1.695, -1.069,
        # -1.5955, 0.0165, -1.5625, 0.2665,    # 青フィールドの実物に無い (2026-10-30 の記録で確認)
        -1.599, -0.2665, -1.559, -0.020,       # (位置は測っていない)
        -0.065, 0.8715, -0.025, 1.6715,        # 列 2 (外周壁から生える)
        -0.065, -1.6715, -0.025, -0.8715,
        0.765, 0.0225, 0.805, 0.8905,          # 列 3 (センターラインから生える)
        0.765, -0.8905, 0.805, -0.0225,
        2.5025, -0.020, 2.8025, 0.020,         # 棚の裏のセンターライン
      ]

      # ビンゴ棚 (3 x 3、マスの幅 0.30 m、仕切り 0.01 m で全幅 0.94 m)。両チームから使う 1 台を中実の箱とみなす。
      # 自チーム側の面は shelf の ymax
      shelf: [1.5625, -0.30, 2.5025, 0.30]
      shelf_height: 0.9
      shelf_columns_x: [1.7225, 2.0325, 2.3425]   # 列 0..2 の中心
      shelf_rows: 3

      # ノーツ (一辺 note_size の立方体)。自チームの 5 個の中心。番号 0 が外周壁の側。
      # 中心は -x 端から 0.150 + 0.235 * i (i = 0..4。外周の壁との間は 0.075 m、隣どうしの間は 0.085 m)。
      # 相手チームのノーツは y を反転した位置にある (sotoba は両方を作る)
      notes_x: [-2.635, -2.400, -2.165, -1.930, -1.695]
      notes_y: 0.125
      note_size: 0.15

      # 機体中心 (base_link) のスタート位置 [x, y, yaw] (スタートゾーンの奥行き 1.05 m、x = -2.785..-1.735)。
      # sotoba の初期シード (LiDAR の姿勢) は、これと LiDAR の取付 (lidar_x / lidar_y / lidar_yaw) から求める。
      # 経路 (config/paths/*.route.yaml) の始点も、ここに合わせてある
      # 機体の正面 (把持機構の側) をスタート側 (-x) に、LiDAR をビンゴ側 (+x) に向けて置く
      start_pose: [-2.2, 1.3, 3.141592653589793]
