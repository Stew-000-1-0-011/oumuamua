# フィールド (千葉大学ロボットコンテスト 2026) の寸法。フィールドの値はここにしか書かない。
# 読むもの: sotoba_node (推定に使う形)、robot_sim (模擬の世界)、task_commander (動く前の間隔の確認と作業の場所)、
#           oumuamua-controller の bridge (画面の表示)、make_path.py (経路の定義の field_file から、壁との間隔の確認)。
#
# 座標はフィールド座標系: 原点はフィールド中心の床、+x がスタート -> ビンゴ、+y が左。青コートが +y、赤コートが -y。
# 自チームの色は team (bringup.launch.py の team 引数で上書きする)。start_pose・notes_*・shelf の「自チーム側」と、
# task_commander.yaml・経路 (config/paths) の場所は、どれも自チームが +y 側にあるとして (青コートの座標で) 書く。
# 赤なら、各ノードがそれを y について反転して (x, -y, -yaw) 使う。壁と外周 (bounds, walls) は実際のフィールドの座標
# 箱は [xmin, ymin, xmax, ymax] [m] で、壁は厚み (0.040 m) 込みの外形。
# x は青フィールドを巻き尺で測った値 (2026-10-31)。外周の内寸 5.570 m、
# 外周から下に伸びる壁: -x 端から 1.050、壁 (0.040)、1.630、壁、+x 端まで 2.810。
# センターラインから上に伸びる壁: -x 端から 1.880、壁、1.630、壁。-y 側は y を反転したものとしている。
# 外周から下に伸びる壁の長さ (外周の内側の面から): スタートゾーンの境界 0.592、列 2 0.800 (2026-10-31 に測った)。
# ほかの y (センターラインから上に伸びる列の長さ、外周の幅) は測っていないので、厚みを 0.040 にした以外は前の値のまま
/**:
  ros__parameters:
    field:
      team: blue                # blue (+y 側) か red (-y 側)
      # 外周壁の内側の面 (ロボットはこの中にいる)
      bounds: [-2.785, -1.655, 2.785, 1.655]
      # 壁の高さ [m]。sotoba は、これが LiDAR の走査面 (lidar_height) より低い壁を見えないものとして扱う。
      # 実物は 0.09 m だが、走査面 (0.14 m) より高いものとして 0.3 にしてある
      wall_height: 0.3
      # 内側の壁 (外周壁以外)。sotoba_ros の旧 objects.cpp と同じもの
      walls: [
        -2.8025, -0.020, 1.225, 0.020,         # センターライン (棚の -x 側の面まで)
        -0.905, 0.0225, -0.865, 1.0405,        # スラロームの列 1 (センターラインから生える。2026-10-31 に 0.15 m 伸ばした)
        -0.905, -1.0405, -0.865, -0.0225,
        -1.735, 1.063, -1.695, 1.669,          # スタートゾーンとスラロームの境界 (外周の内側の面から 0.592 m)
        -1.735, -1.669, -1.695, -1.063,
        # -1.5955, 0.0165, -1.5625, 0.2665,    # 青フィールドの実物に無い (2026-10-30 の記録で確認)
        -1.599, -0.2665, -1.559, -0.020,       # (位置は測っていない)
        -0.065, 0.855, -0.025, 1.6715,         # 列 2 (外周壁から生える。外周の内側の面から 0.800 m)
        -0.065, -1.6715, -0.025, -0.855,
        0.765, 0.0225, 0.805, 1.0405,          # 列 3 (センターラインから生える。2026-10-31 に 0.15 m 伸ばした)
        0.765, -1.0405, 0.805, -0.0225,
        2.285, -0.020, 2.8025, 0.020,          # 棚の裏のセンターライン (棚の +x 側の面から)
      ]

      # ビンゴ棚 (3 x 3、マスの幅 0.30 m、仕切りと両端の壁 0.040 m で全幅 1.06 m)。両チームから使う 1 台を中実の箱とみなす。
      # 自チーム側の面は shelf の ymax。x は 2026-10-31 に測った値: 列 3 の +x 側の面 (x = 0.805) から棚の -x 側の面まで 0.420 m。
      # 棚の +x 側から外周の壁までは 0.476 m と測ったが、x 方向の寸法の合計と 0.024 m 合わないので、ここで吸収して 0.500 m にしてある。
      # 奥行き (y) は測っていない
      shelf: [1.225, -0.30, 2.285, 0.30]
      shelf_height: 0.9
      shelf_columns_x: [1.415, 1.755, 2.095]   # 列 0..2 の中心
      shelf_rows: 3

      # ノーツ (一辺 note_size の立方体)。自チームの 5 個の中心。番号 0 が外周壁の側。
      # 中心は -x 端から 0.150 + 0.230 * i (i = 0..4。外周の壁との間は 0.075 m、隣どうしの間は 0.080 m)。
      # 相手チームのノーツは y を反転した位置にある (sotoba は両方を作る)
      notes_x: [-2.635, -2.405, -2.175, -1.945, -1.715]
      notes_y: 0.125
      note_size: 0.15

      # 機体中心 (base_link) のスタート位置 [x, y, yaw] (スタートゾーンの奥行き 1.05 m、x = -2.785..-1.735)。
      # sotoba の初期シード (LiDAR の姿勢) は、これと LiDAR の取付 (lidar_x / lidar_y / lidar_yaw) から求める。
      # 経路 (config/paths/*.route.yaml) の始点も、ここに合わせてある
      # 機体の正面 (把持機構の側) をスタート側 (-x) に、LiDAR をビンゴ側 (+x) に向けて置く
      start_pose: [-2.2, 1.3, 3.141592653589793]
