# フィールド (千葉大学ロボットコンテスト 2026) の寸法。フィールドの値はここにしか書かない。
# 読むもの: sotoba_node (推定に使う形)、robot_sim (模擬の世界)、task_commander (動く前の間隔の確認と作業の場所)、
#           oumuamua-controller の bridge (画面の表示)、make_path.py (経路の定義の field_file から、壁との間隔の確認)。
#
# 座標はフィールド座標系: 原点はフィールド中心の床、+x がスタート -> ビンゴ、+y が左。自チームは +y 側。
# 箱は [xmin, ymin, xmax, ymax] [m] で、壁は厚み (0.033 m) 込みの外形。
/**:
  ros__parameters:
    field:
      # 外周壁の内側の面 (ロボットはこの中にいる)
      bounds: [-2.786, -1.655, 2.786, 1.655]
      # 壁の高さ [m]。sotoba は、これが LiDAR の走査面 (lidar_height) より低い壁を見えないものとして扱う。
      # 実物は 0.09 m だが、走査面 (0.14 m) より高いものとして 0.3 にしてある
      wall_height: 0.3
      # 内側の壁 (外周壁以外)。sotoba_ros の旧 objects.cpp と同じもの
      walls: [
        -2.8025, -0.0165, 1.5625, 0.0165,      # センターライン
        -0.8375, 0.019, -0.8045, 0.8905,       # スラロームの列 1 (センターラインから生える)
        -0.8375, -0.8905, -0.8045, -0.019,
        -1.5955, 1.069, -1.5625, 1.669,        # スタートゾーンとスラロームの境界
        -1.5955, -1.669, -1.5625, -1.069,
        -1.5955, 0.0165, -1.5625, 0.2665,
        -1.5955, -0.2665, -1.5625, -0.0165,
        0.0045, 0.8715, 0.0375, 1.6715,        # 列 2 (外周壁から生える)
        0.0045, -1.6715, 0.0375, -0.8715,
        0.8045, 0.019, 0.8375, 0.8905,         # 列 3 (センターラインから生える)
        0.8045, -0.8905, 0.8375, -0.019,
        2.5025, -0.0165, 2.8025, 0.0165,       # 棚の裏のセンターライン
      ]

      # ビンゴ棚 (3 x 3、マスの幅 0.30 m、仕切り 0.01 m で全幅 0.94 m)。両チームから使う 1 台を中実の箱とみなす。
      # 自チーム側の面は shelf の ymax
      shelf: [1.5625, -0.30, 2.5025, 0.30]
      shelf_height: 0.9
      shelf_columns_x: [1.7225, 2.0325, 2.3425]   # 列 0..2 の中心
      shelf_rows: 3

      # ノーツ (一辺 note_size の立方体)。自チームの 6 個の中心。番号 0 が外周壁の側。
      # 相手チームのノーツは y を反転した位置にある (sotoba は両方を作る)
      notes_x: [-2.699, -2.499, -2.299, -2.099, -1.899, -1.699]
      notes_y: 0.125
      note_size: 0.15

      # 機体中心 (base_link) のスタート位置 [x, y, yaw] (スタートゾーン 1.24 x 0.8 m、y = 0.855..1.655)。
      # sotoba の初期シード (LiDAR の姿勢) は、これと LiDAR の取付 (lidar_x / lidar_y / lidar_yaw) から求める。
      # 経路 (config/paths/*.route.yaml) の始点も、ここに合わせてある
      start_pose: [-2.2, 1.3, 0.0]
