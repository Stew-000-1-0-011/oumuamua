# oumuamua-controller の bridge ノード (oumuamua_controller_bridge) のパラメータ。bridge は既定値を持たないので、全部ここに書く。
# 起動: ros2 launch oumuamua_controller_bridge bridge.launch.py (既定でこのファイルを読む)
# Parameters of the bridge node. ROS parameters cannot hold lists of lists, so the pairs are flat;
# oumuamua_controller_bridge.config.build_config() turns them into the BridgeServer config.
# fake_robot.DEFAULT_CONFIG must equal build_config() of this file (test_fake_robot checks it when it can find this file).
# Field values are copied from oumuamua_bringup/config/task_commander.yaml.
bridge:
  ros__parameters:
    robot_name: "oumuamua"
    lift_preset_names: ["下段", "中段", "上段", "0 点"]
    lift_preset_heights: [0.01, 0.35, 0.69, 0.0]
    lift_max: 0.85   # gripper.yaml の lift.max_height と合わせる
    speed_levels: [0.3, 1.0, 0.8, 1.8, 1.5, 2.5]   # [v, w] pairs: m/s, rad/s
    blocks: 6
    columns: 3
    rows: 3
    field_bounds: [-2.786, -1.655, 2.786, 1.655]
    field_obstacles: [
      -2.8025, -0.0165, 1.5625, 0.0165,
      -0.8375, 0.019, -0.8045, 0.8905,
      -0.8375, -0.8905, -0.8045, -0.019,
      -1.5955, 1.069, -1.5625, 1.669,
      -1.5955, -1.669, -1.5625, -1.069,
      -1.5955, 0.0165, -1.5625, 0.2665,
      -1.5955, -0.2665, -1.5625, -0.0165,
      0.0045, 0.8715, 0.0375, 1.6715,
      0.0045, -1.6715, 0.0375, -0.8715,
      0.8045, 0.019, 0.8375, 0.8905,
      0.8045, -0.8905, 0.8375, -0.019,
      2.5025, -0.0165, 2.8025, 0.0165,
      1.5625, -0.30, 2.5025, 0.30,
    ]
    shelf: [1.5625, -0.30, 2.5025, 0.30]
    start_pose: [-2.2, 1.3, 0.0]
    robot_radius: 0.32
    completion_setup_files: ["/opt/ros/$ROS_DISTRO/setup.bash"]
