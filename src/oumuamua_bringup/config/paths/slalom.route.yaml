# スラロームの往路 (入口 -> 出口) の定義。これから slalom_forward.csv と、逆にたどる slalom_backward.csv を作る:
#   ros2 run path_follower make_path.py slalom.route.yaml slalom_forward.csv --plot preview.png
#   ros2 run path_follower make_path.py slalom.route.yaml slalom_backward.csv --reverse
# 座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左)。
#
# 入口 (スタートゾーン側、境界の隙間の手前) と出口 (ゴールゾーン側、列 3 を抜けた所) は
# task_commander.yaml の slalom.entrance / slalom.exit と合わせること。
# 通る所は start_to_shelf.route.yaml と同じ (壁の隙間と、壁と壁の間の通路を、どれも中央で通る):
#   ゾーンの境界 (x=-1.715) の隙間 y=0.02..1.069     -> y = 0.668 を +x 向きに (青フィールドには隙間の下の短い壁が無い)
#   境界と列 1 (x=-0.885) の間                       -> x = -1.300 を +y 向きに
#   列 1 の先端 (y=0.8905) と外壁 (y=1.655) の間     -> y = 1.273 を +x 向きに
#   列 1 と列 2 (x=-0.045) の間                      -> x = -0.465 を -y 向きに
#   列 2 の先端 (y=0.8715) とセンターラインの間      -> y = 0.446 を +x 向きに
#   列 2 と列 3 (x=0.785) の間                       -> x = 0.370 を +y 向きに
#   列 3 の先端 (y=0.8905) と外壁の間                -> y = 1.273 を +x 向きに (出口はゴールゾーンに入った所)
spacing: 0.01

corners:               # [x, y, 角を丸める半径]
  - [-2.05, 0.668]     # 入口
  - [-1.3, 0.668, 0.30]
  - [-1.3, 1.273, 0.30]
  - [-0.465, 1.273, 0.30]
  - [-0.465, 0.446, 0.30]
  - [0.370, 0.446, 0.30]
  - [0.370, 1.273, 0.30]
  - [1.25, 1.273]      # 出口

# 機体は、ずっと後ろ (LiDAR の側) を進む向きに向ける (入口・出口では機体の向き yaw = pi、LiDAR が +x を向く)。
# 後ろに飛び出した LiDAR が常に進む向きを向くので、通路で横の壁に引っかからない。
# 復路 (--reverse) は同じ向きのまま逆にたどるので、後ろ向きに走る
yaw:
  - [0.0, 3.141592653589793]
follow_heading:
  from: 0.0
  blend: 0.2
  offset: 3.141592653589793   # 機体の後ろ (LiDAR の側) を進む向きに向ける

# 機体の外形 (機体座標系、x 前・y 左)。半径 0.30 m の円に収まるオムニ 3 輪で、
# 後ろに LiDAR (中心が機体中心から 0.28 m 後ろ、本体の幅を 7 cm と見ている) が 0.315 m まで飛び出している
footprint:
  - [-0.3150, 0.0350]
  - [-0.3150, -0.0350]
  - [-0.2980, -0.0350]
