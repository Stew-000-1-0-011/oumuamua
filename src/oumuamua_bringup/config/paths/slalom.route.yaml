# スラロームの往路 (入口 -> 出口) の定義。これから slalom_forward.csv と、逆にたどる slalom_backward.csv を作る:
#   ros2 run path_follower make_path.py slalom.route.yaml slalom_forward.csv --plot preview.png
#   ros2 run path_follower make_path.py slalom.route.yaml slalom_backward.csv --reverse
# 座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左)。
#
# 入口 (スタートゾーン側、境界の隙間の手前) と出口 (ゴールゾーン側、列 3 を抜けた所) は
# task_commander.yaml の slalom.entrance / slalom.exit と合わせること。
# 角の位置と半径は、外形と壁の間を min_clearance 以上空けて、所要時間が最短になるよう探したもの
# (path_follower.yaml の上限: 最高 7.0 m/s、加減速と横加速度 5 m/s^2 で計算して 2.8 s。前の、通路の中央を通る経路は 3.9 s)。
# 所要時間は曲がり角の横加速度と加減速で決まる
spacing: 0.01

corners:               # [x, y, 角を丸める半径]
  - [-2.05, 0.668]     # 入口
  - [-1.5414, 0.7961, 0.7570]
  - [-1.1331, 1.2194, 0.4906]
  - [-0.5894, 1.1688, 0.5213]
  - [-0.3622, 0.6383, 0.4312]
  - [0.1710, 0.5208, 0.4090]
  - [0.4516, 1.1055, 0.5474]
  - [1.25, 1.273]      # 出口

# 機体の向きは変えない (yaw = pi、LiDAR が +x を向く。入口・出口と同じ)。全方向移動なので、回らずに横へも進める。
# 向きを進む向きに合わせる経路と計算上の所要時間はほぼ同じだが、回るぶん車輪の速さを取られず、追従のずれも出にくい。
# 復路 (--reverse) も同じ向きのまま逆にたどる
yaw:
  - [0.0, 3.141592653589793]

# 機体の外形 (機体座標系、x 前・y 左)。CAD の足回り + LiDAR とその取付 (raised-box の footprint) を機体座標系に回したもの。
# 前 0.159 m、左右 0.236 / 0.226 m、後ろ 0.331 m (LiDAR)。把持機構は持ち上げて壁の上を通るので入れない
footprint:
  - [0.0834, -0.2255]
  - [0.1582, -0.1824]
  - [0.1589, -0.1818]
  - [0.1593, -0.1809]
  - [0.1593, 0.1910]
  - [0.1590, 0.1920]
  - [0.1584, 0.1927]
  - [0.0839, 0.2357]
  - [0.0830, 0.2360]
  - [0.0822, 0.2359]
  - [-0.2393, 0.0504]
  - [-0.3311, 0.0504]
  - [-0.3311, -0.0400]
  - [-0.2393, -0.0400]
  - [0.0817, -0.2253]
  - [0.0825, -0.2256]
# 外形と壁の間に最低これだけ空いていなければ、経路ファイルを作らない [m]
min_clearance: 0.04     # 2 cm では実機で機体の側面が壁に当たった
# LiDAR の取付位置 (機体座標系)。図に軌跡を描く。bringup.launch.py の lidar_x / lidar_y と合わせること
lidar: [-0.28, 0.0]

# 間隔の確認と図に使うフィールドの寸法 (外周と壁・棚) は field.yaml から読む
field: ../field.yaml
