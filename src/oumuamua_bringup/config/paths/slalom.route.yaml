# スラローム: 入口 -> 出口。全昇降が carry に到達してから走行する。
# 復路は --reverse で、各位置の機体姿勢を保ったまま逆順にたどる。
# リポジトリルートで再生成 (ROS不要):
#   python src/path_follower/scripts/make_path.py src/oumuamua_bringup/config/paths/slalom.route.yaml src/oumuamua_bringup/config/paths/slalom_forward.csv --plot docs/superpowers/artifacts/slalom_forward.png
#   python src/path_follower/scripts/make_path.py src/oumuamua_bringup/config/paths/slalom.route.yaml src/oumuamua_bringup/config/paths/slalom_backward.csv --reverse --plot docs/superpowers/artifacts/slalom_backward.png
# フィールド座標: 原点は中心、+x がスタート -> ビンゴ、+y が自チーム側。
# 端点は task_commander.yaml の slalom.entrance / exit と一致させる。
spacing: 0.01

# 境界の隙間 -> 列1の外周側 -> 列2の中央側 -> 列3の外周側。
# 実形状でも十分な間隔が得られるため、既存の中央通過線と角丸半径を維持する。
corners:
  - [-2.05, 0.668]
  - [-1.2, 0.668, 0.30]
  - [-1.2, 1.273, 0.30]
  - [-0.4, 1.273, 0.30]
  - [-0.4, 0.444, 0.30]
  - [0.421, 0.444, 0.30]
  - [0.421, 1.273, 0.30]
  - [1.25, 1.273]

# base_link の後ろ (-x、LiDAR側) を往路の進行方向へ向ける。
yaw:
  - [0.0, 3.141592653589793]
follow_heading:
  from: 0.0
  blend: 0.2
  offset: 3.141592653589793

# 添付原データをそのまま保存。2026-10-30に確認済みの対応:
#   x_base = -y_attachment, y_base = x_attachment (+pi/2)。原点は3輪車軸中心の重心。
footprint_file: ../footprints/raised.yaml
footprint_yaw: 1.5707963267948966
# 入口・出口では昇降下でも余裕を確保する。下状態での通過用経路ではない。
endpoint_footprint_file: ../footprints/lowered.yaml
# 小さい上形状の使用条件: 持ち上げた機構と保持ノーツの下面が90 mm壁より上。
# 原データの幾何的allowanceとは別に、走行用の余裕を取る。
min_clearance: 0.04

# LiDARの図示位置は既存TFに合わせる。原形状の座標変換でTF自体は変更しない。
lidar: [-0.28, 0.0]
field: ../field.yaml
# 本文の壁厚38 mmを保守的に使用 (図面/field.yamlは33 mm)。共有フィールドは変えない。
field_wall_padding: 0.0025
field_bounds_padding: 0.005
