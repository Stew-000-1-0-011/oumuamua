# 速さ優先の経路の定義。スタート位置から棚の正面まで、スラロームをジグザグに抜ける。これから
# fast_start_to_shelf.csv (行き) と fast_shelf_to_start.csv (帰り、--reverse) を作る:
#   ros2 run path_follower make_path.py fast_start_to_shelf.route.yaml fast_start_to_shelf.csv --plot preview.png
#   ros2 run path_follower make_path.py fast_start_to_shelf.route.yaml fast_shelf_to_start.csv --reverse
# 座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左)。
#
# start_to_shelf (壁の隙間の中央を通る階段状、機体の向きは進む向き) と違い、
# - 機体の向きはほぼ yaw = pi (LiDAR が +x を向く) のまま (向きを変える時間と、角速度の上限で曲がり角が遅くなるのを省く)。
#   境界の壁と列 1 の間の狭い区間だけ、進む向きに回す
# - 角を大きく丸めて、曲がり角を速く回れるようにする。その代わり壁の近くを通る
# 角の位置と半径は、外形と壁の間をできるだけ空けつつ、所要時間が最短になるよう探したもの
# (最高 2.0 m/s、加減速 2.5 m/s^2、横加速度 1.5 m/s^2、角速度 2.5 rad/s で計算して 6.9 s)。
# 壁との間隔は約 5.5 cm で、これより空けるとスタート位置 (外壁まで 5.5 cm) を除いても間に合わなくなる
spacing: 0.01

corners:               # [x, y, 角を丸める半径]
  - [-2.2, 1.3]        # スタート位置 (field.yaml の start_pose)
  - [-1.9252, 0.7156, 0.669]
  - [-1.2632, 0.6745, 0.3129]
  - [-1.1182, 1.2782, 0.3114]
  - [-0.5518, 1.2738, 0.4679]
  - [-0.2460, 0.4804, 0.4112]
  - [0.3748, 0.5365, 0.3668]
  - [0.4273, 1.2660, 0.4309]
  - [1.6916, 1.2273, 1.1792]
  - [2.0325, 0.75]     # 棚の +y 側の面 (y=0.30) の中央の正面、面から 0.45 m 手前

# 機体の向きは yaw = pi (LiDAR が +x を向く)。ただし境界の壁 (x=-1.579) と列 1 (x=-0.821) の間の狭い区間だけは、
# 後ろ (LiDAR の側) を進む向きに合わせる。後ろに飛び出した LiDAR を通路に沿わせて、横の壁 (列 1) に向けないため
yaw:
  - [0.0, 3.141592653589793]
follow_heading:
  from: 0.88
  to: 2.02
  blend: 0.15
  offset: 3.141592653589793   # 機体の後ろ (LiDAR の側) を進む向きに向ける

# 機体の外形 (機体座標系、x 前・y 左)。半径 0.30 m の円に収まるオムニ 3 輪で、
# 後ろに LiDAR (中心が機体中心から 0.28 m 後ろ、本体の幅を 7 cm と見ている) が 0.315 m まで飛び出している
footprint:
  - [-0.3150, 0.0350]
  - [-0.3150, -0.0350]
  - [-0.2980, -0.0350]
  - [-0.2893, -0.0795]
  - [-0.2740, -0.1222]
  - [-0.2525, -0.1620]
  - [-0.2252, -0.1982]
  - [-0.1927, -0.2299]
  - [-0.1559, -0.2563]
  - [-0.1155, -0.2769]
  - [-0.0725, -0.2911]
  - [-0.0278, -0.2987]
  - [0.0175, -0.2995]
  - [0.0624, -0.2934]
  - [0.1059, -0.2807]
  - [0.1470, -0.2615]
  - [0.1847, -0.2364]
  - [0.2182, -0.2058]
  - [0.2468, -0.1706]
  - [0.2696, -0.1315]
  - [0.2864, -0.0894]
  - [0.2966, -0.0452]
  - [0.3000, 0.0000]
  - [0.2966, 0.0452]
  - [0.2864, 0.0894]
  - [0.2696, 0.1315]
  - [0.2468, 0.1706]
  - [0.2182, 0.2058]
  - [0.1847, 0.2364]
  - [0.1470, 0.2615]
  - [0.1059, 0.2807]
  - [0.0624, 0.2934]
  - [0.0175, 0.2995]
  - [-0.0278, 0.2987]
  - [-0.0725, 0.2911]
  - [-0.1155, 0.2769]
  - [-0.1559, 0.2563]
  - [-0.1927, 0.2299]
  - [-0.2252, 0.1982]
  - [-0.2525, 0.1620]
  - [-0.2740, 0.1222]
  - [-0.2893, 0.0795]
  - [-0.2980, 0.0350]
# 外形と壁の間に最低これだけ空いていなければ、経路ファイルを作らない [m]
min_clearance: 0.04
# LiDAR の取付位置 (機体座標系)。図に軌跡を描く。bringup.launch.py の lidar_x / lidar_y と合わせること
lidar: [-0.28, 0.0]

# 間隔の確認と図に使うフィールドの寸法 (外周と壁・棚) は field.yaml から読む
field: ../field.yaml
