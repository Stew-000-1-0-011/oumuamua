# 速さ優先の経路の定義。スタート位置から棚の正面まで、スラロームをジグザグに抜ける。これから
# fast_start_to_shelf.csv (行き) と fast_shelf_to_start.csv (帰り、--reverse) を作る:
#   ros2 run path_follower make_path.py fast_start_to_shelf.route.yaml fast_start_to_shelf.csv --plot preview.png
#   ros2 run path_follower make_path.py fast_start_to_shelf.route.yaml fast_shelf_to_start.csv --reverse
# 座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左)。
#
# start_to_shelf (壁の隙間の中央を通る階段状、機体の向きは進む向き) と違い、
# - 機体の向きはほぼ yaw = pi (LiDAR が +x を向く) のまま (向きを変える時間と、角速度の上限で曲がり角が遅くなるのを省く)。
#   境界の壁と列 1 の間の狭い区間だけ、進む向きに回す
# - 角を大きく丸めて、曲がり角を速く回れるようにする。その代わり壁の近くを通る
# 角の位置と半径は、外形と壁の間を min_clearance 以上空けて、所要時間が最短になるよう探したもの
# (青フィールドの寸法で。path_follower.yaml の上限: 最高 3.0 m/s、加減速 2.5 m/s^2、横加速度 2.5 m/s^2、
# 角速度 9.42 rad/s で計算して 5.3 s)。所要時間はほぼ横加速度 (曲がり角) と加減速で決まり、
# 直線が短いので最高速度には届かない (2.0 m/s)
spacing: 0.01

corners:               # [x, y, 角を丸める半径]
  - [-2.2, 1.3]        # スタート位置 (field.yaml の start_pose)
  - [-1.9306, 0.6845, 0.4399]
  - [-1.4336, 0.7436, 0.3289]
  - [-1.2024, 1.1647, 0.5237]
  - [-0.7116, 1.2476, 0.3590]
  - [-0.1927, 0.4847, 0.3633]
  - [0.2379, 0.6020, 0.3894]
  - [0.5294, 1.2470, 0.4846]
  - [1.5174, 1.1848, 1.8916]
  - [2.0325, 0.75]     # 棚の +y 側の面 (y=0.30) の中央の正面、面から 0.45 m 手前

# 機体の向きは yaw = pi (LiDAR が +x を向く)。ただし境界の壁 (x=-1.715) と列 1 (x=-0.885) の間の狭い区間だけは、
# 後ろ (LiDAR の側) を進む向きに合わせる。後ろに飛び出した LiDAR を通路に沿わせて、横の壁 (列 1) に向けないため
yaw:
  - [0.0, 3.141592653589793]
follow_heading:
  from: 0.80
  to: 1.93
  blend: 0.15
  offset: 3.141592653589793   # 機体の後ろ (LiDAR の側) を進む向きに向ける

# 機体の外形 (機体座標系、x 前・y 左)。半径 0.30 m の円に収まるオムニ 3 輪で、
# 後ろに LiDAR (中心が機体中心から 0.28 m 後ろ、本体の幅を 7 cm と見ている) が 0.315 m まで飛び出している
footprint:
  - [-0.3150, 0.0350]
  - [-0.3150, -0.0350]
  - [-0.2980, -0.0350]
  - [-0.2893, -0.0795]
  - [-0.2740, -0.1222]
  - [-0.2525, -0.1620]
  - [-0.2252, -0.1982]
  - [-0.1927, -0.2299]
  - [-0.1559, -0.2563]
  - [-0.1155, -0.2769]
  - [-0.0725, -0.2911]
  - [-0.0278, -0.2987]
  - [0.0175, -0.2995]
  - [0.0624, -0.2934]
  - [0.1059, -0.2807]
  - [0.1470, -0.2615]
  - [0.1847, -0.2364]
  - [0.2182, -0.2058]
  - [0.2468, -0.1706]
  - [0.2696, -0.1315]
  - [0.2864, -0.0894]
  - [0.2966, -0.0452]
  - [0.3000, 0.0000]
  - [0.2966, 0.0452]
  - [0.2864, 0.0894]
  - [0.2696, 0.1315]
  - [0.2468, 0.1706]
  - [0.2182, 0.2058]
  - [0.1847, 0.2364]
  - [0.1470, 0.2615]
  - [0.1059, 0.2807]
  - [0.0624, 0.2934]
  - [0.0175, 0.2995]
  - [-0.0278, 0.2987]
  - [-0.0725, 0.2911]
  - [-0.1155, 0.2769]
  - [-0.1559, 0.2563]
  - [-0.1927, 0.2299]
  - [-0.2252, 0.1982]
  - [-0.2525, 0.1620]
  - [-0.2740, 0.1222]
  - [-0.2893, 0.0795]
  - [-0.2980, 0.0350]
# 外形と壁の間に最低これだけ空いていなければ、経路ファイルを作らない [m]
min_clearance: 0.02     # 速さ優先なので、ほかの経路 (0.04) より詰めてある
# LiDAR の取付位置 (機体座標系)。図に軌跡を描く。bringup.launch.py の lidar_x / lidar_y と合わせること
lidar: [-0.28, 0.0]

# 間隔の確認と図に使うフィールドの寸法 (外周と壁・棚) は field.yaml から読む
field: ../field.yaml
