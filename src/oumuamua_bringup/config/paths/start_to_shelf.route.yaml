# スタート位置から棚の正面までの経路の定義。これから start_to_shelf.csv を作る:
#   ros2 run path_follower make_path.py start_to_shelf.route.yaml start_to_shelf.csv --plot preview.png
# 座標はフィールド座標系 (原点はフィールド中心、+x がスタート -> ビンゴ、+y が左)。
#
# スタートゾーンからスラロームを抜ける。壁の隙間と、壁と壁の間の通路を、どれも中央で通る:
#   ゾーンの境界 (x=-1.579) の隙間 y=0.2665..1.069   -> y = 0.668 を +x 向きに
#   境界と列 1 (x=-0.821) の間                       -> x = -1.200 を +y 向きに
#   列 1 の先端 (y=0.8905) と外壁 (y=1.655) の間     -> y = 1.273 を +x 向きに
#   列 1 と列 2 (x=0.021) の間                       -> x = -0.400 を -y 向きに
#   列 2 の先端 (y=0.8715) とセンターラインの間      -> y = 0.444 を +x 向きに
#   列 2 と列 3 (x=0.821) の間                       -> x = 0.421 を +y 向きに
#   列 3 の先端 (y=0.8905) と外壁の間                -> y = 1.273 を +x 向きに
spacing: 0.01

corners:               # [x, y, 角を丸める半径]
  - [-2.2, 1.3]        # スタート位置 (field.yaml の start_pose)
  - [-2.2, 0.668, 0.30]
  - [-1.2, 0.668, 0.30]
  - [-1.2, 1.273, 0.30]
  - [-0.4, 1.273, 0.30]
  - [-0.4, 0.444, 0.30]
  - [0.421, 0.444, 0.30]
  - [0.421, 1.273, 0.30]
  - [2.0325, 1.273, 0.45]
  - [2.0325, 0.75]     # 棚の +y 側の面 (y=0.30) の中央の正面、面から 0.45 m 手前
                       # (棚に正対するので、LiDAR は面から 0.17 m。止まるときに 2 cm ほど行き過ぎる)

# 機体の向き。スタートでは yaw = pi (LiDAR が +x を向く。field.yaml の start_pose と合わせる) で、
# 境界の隙間に入るあたり (道のり 0.9 m) から先は、機体の後ろ (LiDAR の側) を進む向きに合わせる。
# 後ろに飛び出した LiDAR が常に進む向きを向くので、通路で横の壁に引っかからない。
# 終点では yaw = +pi/2 (LiDAR が -y を向いて棚に正対) になる
yaw:
  - [0.0, 3.141592653589793]
follow_heading:
  from: 0.9
  blend: 0.2
  offset: 3.141592653589793   # 機体の後ろ (LiDAR の側) を進む向きに向ける

# 機体の外形 (機体座標系、x 前・y 左)。半径 0.30 m の円に収まるオムニ 3 輪で、
# 後ろに LiDAR (中心が機体中心から 0.28 m 後ろ、本体の幅を 7 cm と見ている) が 0.315 m まで飛び出している
footprint:
  - [-0.3150, 0.0350]
  - [-0.3150, -0.0350]
  - [-0.2980, -0.0350]
  - [-0.2893, -0.0795]
  - [-0.2740, -0.1222]
  - [-0.2525, -0.1620]
  - [-0.2252, -0.1982]
  - [-0.1927, -0.2299]
  - [-0.1559, -0.2563]
  - [-0.1155, -0.2769]
  - [-0.0725, -0.2911]
  - [-0.0278, -0.2987]
  - [0.0175, -0.2995]
  - [0.0624, -0.2934]
  - [0.1059, -0.2807]
  - [0.1470, -0.2615]
  - [0.1847, -0.2364]
  - [0.2182, -0.2058]
  - [0.2468, -0.1706]
  - [0.2696, -0.1315]
  - [0.2864, -0.0894]
  - [0.2966, -0.0452]
  - [0.3000, 0.0000]
  - [0.2966, 0.0452]
  - [0.2864, 0.0894]
  - [0.2696, 0.1315]
  - [0.2468, 0.1706]
  - [0.2182, 0.2058]
  - [0.1847, 0.2364]
  - [0.1470, 0.2615]
  - [0.1059, 0.2807]
  - [0.0624, 0.2934]
  - [0.0175, 0.2995]
  - [-0.0278, 0.2987]
  - [-0.0725, 0.2911]
  - [-0.1155, 0.2769]
  - [-0.1559, 0.2563]
  - [-0.1927, 0.2299]
  - [-0.2252, 0.1982]
  - [-0.2525, 0.1620]
  - [-0.2740, 0.1222]
  - [-0.2893, 0.0795]
  - [-0.2980, 0.0350]
# 外形と壁の間に最低これだけ空いていなければ、経路ファイルを作らない [m]
min_clearance: 0.04
# LiDAR の取付位置 (機体座標系)。図に軌跡を描く。bringup.launch.py の lidar_x / lidar_y と合わせること
lidar: [-0.28, 0.0]

# 間隔の確認と図に使うフィールドの寸法 (外周と壁・棚) は field.yaml から読む
field: ../field.yaml
