# 把持機構の吸引のモータ (mini_shirasu_node: suction<i>) のパラメータ。左 (suction0) は電流制御、右 (suction1) はデューティ制御。
# mini_shirasu_node は既定値を持たないので、全部ここに書く。項目の意味は mini_shirasu_ros の README を参照。
# オン/オフと目標は gripper.yaml の gripper<i> が決め、/suction0/target_current・/suction1/target_duty に送ってくる。
# !!! can_id は各基板のファームの config.rs と合わせること。足回りが基板 0..2 (0x110..0x112) を
#     使っているので、吸引は左が基板 5、右が基板 4 !!!

# --- 全基板共通 ---
/**:
  ros__parameters:
    can_tx_topic: /robomas_can_tx
    can_rx_topic: /robomas_can_rx
    mode: current
    enable_on_start: true
    reset_fault_on_start: true
    control_rate: 50.0
    target_timeout: 0.2         # gripper_node が止まったら 0 (電流 0 A / デューティ 0) になる
    command_timeout: 0.1
    command_retries: 3
    status_timeout: 0.5
    settings:
      # 電流制御で使うのは主に電流ループ (ckp, cki, ke, vmax, imax)。
      # 値は足回りと同じ RZ-735VA-8519 のもの。吸引のモータが違うなら決め直すこと
      vdcmax: 24.0
      ibase: 10.0
      wbase: 300.0
      ke: 0.09
      ckp: 0.02
      cki: 600.0
      dead_duty: 0.0
      i_threshold: 0.5
      duty_max: 0.95
      vmax: 24.0
      imax: 12.0                 # [A] gripper の suction.target より少し上にする (基板側の上限。電流制御のとき)
      wkp: 0.1
      wki: 0.5
      wb: 0.8
      wmax: 300.0
      pkp: 1.5
      pmax: 100.0
      accel_to_current: 0.0
      encoder_cpr: 22419.0
      w_filter_alpha: 0.2
      encoder_reversed: 0.0
      status_period_ms: 20.0

# 左 (gripper0)。機体の前後を入れ替えた (2026-10-27) ので、以前「右」だった基板 5
suction0:
  ros__parameters:
    can_id: {target: 0x115, status: 0x125, command: 0x135, response: 0x145}

# 右 (gripper1)。以前「左」だった基板 4。
# デューティ制御: 電流ループを使わず、目標のデューティをそのまま PWM に出す (settings.duty_max で切り詰める)。
# 基板のファームにデューティモード (mini-shirasu2 5617592 以降) が要る
suction1:
  ros__parameters:
    mode: duty
    can_id: {target: 0x114, status: 0x124, command: 0x134, response: 0x144}
