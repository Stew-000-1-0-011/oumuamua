# state_estimator の上書き。state_estimator の config/state_estimator.yaml の後に読む。
# 速度の入力 (~/body_velocity) は bringup.launch.py の velocity_source 引数で remap する。
# velocity_source:=cmd_vel のときは filter.tau_* も launch が上書きする (指令への追従の遅れ)
state_estimator:
  ros__parameters:
    field_frame: field
    base_frame: base_link
    lidar_frame: laser

    filter:
      # sotoba の推定が予測から 5 sigma 以上外れたら捨てる (傾いた LiDAR での誤対応対策)。
      # 続けて捨てると inflate_after_failures で不確かさを足すので、張り付いたままにはならない
      gate_sigma: 5.0
