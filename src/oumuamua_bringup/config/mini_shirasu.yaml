# 足回りの mini-shirasu 4 枚 (mini_shirasu_node: wheel0..3) のパラメータ。
# 項目の意味は mini_shirasu_ros の README / config/mini_shirasu_node.yaml を参照。
#
# settings は mini-shirasu2 の bench.rs で実機 (RZ-735VA-8519、減速比 11.86) が動いた値で、
# 速度・位置は駆動軸 (ホイール) 基準。chassis_node の gear_ratio を ±1 にしているのはこのため。
# !!! can_id は各基板のファームの config.rs と合わせること。ここでは基板 i に
#     target 0x100+2i, status 0x101+2i, command 0x200+2i, response 0x201+2i を割り当てている !!!

# --- 4 枚共通 ---
/**:
  ros__parameters:
    can_tx_topic: /robomas_can_tx
    can_rx_topic: /robomas_can_rx
    mode: velocity
    enable_on_start: true
    control_rate: 50.0
    target_timeout: 0.2
    command_timeout: 0.1
    command_retries: 3
    status_timeout: 0.5
    settings:
      # mini-shirasu2 の minishirasu-firm/src/bench.rs で、実機 (RZ-735VA-8519、減速比 11.86、
      # エンコーダ AMT102-V を中間軸に付けたもの) の電流・速度・位置モードが動いた値。
      # 位置と速度は encoder_cpr を数える軸 (ここでは駆動軸 = ホイール) 基準になる。
      # 別のモータや減速比で使うなら、bench.rs のコメントを見て決め直すこと
      vdcmax: 24.0            # [V]
      ibase: 10.0             # [A]
      wbase: 300.0            # [rad/s]
      ke: 0.09                # [V/(rad/s)] 駆動軸基準。少し小さめ
      ckp: 0.02               # [V/A] 電気的時定数が短いので比例は小さく、積分で追従させる
      cki: 600.0              # [V/(A s)]
      dead_duty: 0.0
      i_threshold: 0.5        # [A]
      duty_max: 0.95
      vmax: 4.0               # [V] 電流の読みが外れても電流が上がりすぎないよう電圧で抑える
      imax: 8.0               # [A]
      wkp: 0.1                # [A/(rad/s)]
      wki: 0.5                # [A/(rad/s s)]
      wb: 0.8
      wmax: 20.0              # [rad/s]
      pkp: 1.5                # [1/s]
      pmax: 100.0             # [回転]
      accel_to_current: 0.01  # [A/(rad/s^2)]
      encoder_cpr: 22419.0    # [カウント/回転] 駆動軸1回転あたり (8192 * 52 / 19)
      w_filter_alpha: 0.2
      encoder_reversed: 1.0   # 0 / 1
      status_period_ms: 20.0  # 0 で Status を止める

# --- 基板ごと ---
wheel0:
  ros__parameters:
    can_id: {target: 0x100, status: 0x101, command: 0x200, response: 0x201}
wheel1:
  ros__parameters:
    can_id: {target: 0x102, status: 0x103, command: 0x202, response: 0x203}
wheel2:
  ros__parameters:
    can_id: {target: 0x104, status: 0x105, command: 0x204, response: 0x205}
wheel3:
  ros__parameters:
    can_id: {target: 0x106, status: 0x107, command: 0x206, response: 0x207}
